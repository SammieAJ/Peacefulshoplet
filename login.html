<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Peacefulshoplet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2D1810;
            --accent: #C9A86A;
            --soft-cream: #F5F1EA;
            --deep-brown: #1A0F0A;
        }

        body {
            font-family: 'Jost', sans-serif;
            background: linear-gradient(135deg, var(--soft-cream) 0%, #EDE7DC 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .display-font {
            font-family: 'Cormorant Garamond', serif;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(201, 168, 106, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--deep-brown) 100%);
            color: var(--accent);
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .decorative-line {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 20px auto;
        }

        .logo-section {
            background: linear-gradient(135deg, var(--primary) 0%, var(--deep-brown) 100%);
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(201,168,106,0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }
    </style>
</head>
<body>
    <div class="login-card m-4">
        <div class="logo-section relative z-10">
            <h1 class="display-font text-4xl font-bold text-[var(--accent)] mb-2">Peacefulshoplet</h1>
            <p class="text-white/80">Admin Portal</p>
        </div>

        <div class="p-8">
            <h2 class="display-font text-2xl font-bold text-[var(--primary)] text-center mb-2">Welcome Back</h2>
            <div class="decorative-line"></div>
            <p class="text-[var(--primary)]/60 text-center mb-8">Sign in to manage your store</p>

            <div id="alert" class="hidden"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-[var(--primary)] mb-2">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        class="input-field" 
                        placeholder="admin@peacefulshoplet.com"
                        autocomplete="email"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-[var(--primary)] mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        class="input-field" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                </div>

                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center">
                        <input type="checkbox" class="mr-2 w-4 h-4 accent-[var(--accent)]">
                        <span class="text-sm text-[var(--primary)]/70">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-[var(--accent)] hover:underline">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">
                    <span id="login-text">Sign In</span>
                    <span id="login-loading" class="hidden">Signing in...</span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-[var(--primary)]/60">
                    Demo credentials: <br>
                    <span class="font-medium text-[var(--primary)]">admin@peacefulshoplet.com / admin123</span>
                </p>
            </div>

            <div class="mt-8 text-center">
                <a href="index.html" class="text-sm text-[var(--accent)] hover:underline flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Back to Store
                </a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Show loading
            document.getElementById('login-text').classList.add('hidden');
            document.getElementById('login-loading').classList.remove('hidden');
            
            // Simulate API call
            setTimeout(() => {
                // Demo credentials check
                if (email === 'admin@peacefulshoplet.com' && password === 'admin123') {
                    // Set authentication
                    localStorage.setItem('admin_auth', 'true');
                    localStorage.setItem('admin_email', email);
                    
                    showAlert('Login successful! Redirecting...', 'success');
                    
                    // Redirect to admin panel
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1000);
                } else {
                    showAlert('Invalid email or password. Please try again.', 'error');
                    
                    // Reset loading state
                    document.getElementById('login-text').classList.remove('hidden');
                    document.getElementById('login-loading').classList.add('hidden');
                }
            }, 1000);
        }
        
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.classList.remove('hidden');
            
            if (type === 'success') {
                setTimeout(() => {
                    alert.classList.add('hidden');
                }, 3000);
            }
        }

        // Check if already logged in
        if (localStorage.getItem('admin_auth')) {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
